<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nu Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fffdf7; --ink: #1a1208; --muted: #7a7060; --accent: #e85d1a;
  --gold: #c9940a; --green: #158a4a; --red: #c9240a; --border: #e8e0d0; --card: #fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; transition:opacity 0.4s, transform 0.4s; overflow-y:auto; }
.screen.hidden { opacity:0; pointer-events:none; transform:translateY(12px); }

#intro { background:var(--bg); }
.intro-badge { display:inline-block; background:var(--accent); color:#fff; font-size:0.72rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:5px 12px; border-radius:99px; margin-bottom:20px; }
#intro h1 { font-family:'Fraunces',serif; font-size:clamp(2.8rem,8vw,5rem); font-weight:900; line-height:0.95; text-align:center; margin-bottom:16px; }
#intro h1 em { font-style:italic; color:var(--accent); }
#intro .sub { color:var(--muted); font-size:0.95rem; text-align:center; margin-bottom:36px; }
.team-box { background:var(--card); border-radius:20px; padding:28px; border:2px solid var(--border); width:100%; max-width:400px; box-shadow:4px 4px 0 var(--border); }
.team-box h3 { font-family:'Fraunces',serif; font-weight:700; font-size:1.1rem; margin-bottom:18px; }
.team-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
.team-btn { padding:18px 10px; border-radius:14px; border:2.5px solid var(--border); background:var(--bg); color:var(--ink); font-family:'Fraunces',serif; font-size:1.3rem; font-weight:900; cursor:pointer; transition:all 0.15s; text-align:center; position:relative; }
.team-btn:hover:not(.done) { border-color:var(--accent); background:#fff5f0; transform:translateY(-2px); }
.team-btn.selected { border-color:var(--accent); background:var(--accent); color:#fff; transform:translateY(-2px); box-shadow:3px 3px 0 #a03d0a; }
.team-btn .t-label { font-family:'DM Sans',sans-serif; font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; opacity:0.7; display:block; margin-bottom:4px; }
.team-btn.done { border-color:#a0d4b8; background:#e8f7ee; color:var(--green); cursor:default; }
.team-btn.done::after { content:'✓ Jugó'; position:absolute; bottom:7px; left:0; right:0; font-family:'DM Sans',sans-serif; font-size:0.65rem; font-weight:700; }
.btn-start { width:100%; margin-top:16px; padding:16px; border-radius:14px; border:none; background:var(--ink); color:#fff; font-family:'Fraunces',serif; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all 0.15s; }
.btn-start:hover { background:#2d2010; transform:translateY(-1px); }
.btn-start:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }
.btn-podio { width:100%; margin-top:10px; padding:13px; border-radius:14px; border:2px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:600; cursor:pointer; transition:all 0.15s; }
.btn-podio:hover { border-color:var(--gold); color:var(--gold); }

#quiz { max-width:680px; width:100%; }
.q-topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.q-team-tag { background:var(--accent); color:#fff; font-family:'Fraunces',serif; font-size:0.85rem; font-weight:700; padding:5px 14px; border-radius:99px; }
.q-counter { font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:600; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
.progress-bar { width:100%; height:5px; background:var(--border); border-radius:99px; margin-bottom:20px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); border-radius:99px; transition:width 0.5s ease; }
.timer-row { display:flex; align-items:center; justify-content:flex-end; margin-bottom:14px; gap:8px; }
.timer-label { font-size:0.78rem; font-weight:600; color:var(--muted); }
.timer-ring { position:relative; width:44px; height:44px; }
.timer-ring svg { transform:rotate(-90deg); }
.timer-ring circle { fill:none; stroke:var(--border); stroke-width:4; }
.timer-ring .arc { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke 0.3s; }
.timer-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:900; font-size:0.92rem; color:var(--ink); }
.question-text { font-family:'Fraunces',serif; font-size:clamp(1.05rem,2.8vw,1.4rem); font-weight:700; line-height:1.35; margin-bottom:20px; color:var(--ink); background:var(--card); border-radius:16px; padding:22px 24px; border:2px solid var(--border); box-shadow:3px 3px 0 var(--border); }
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; border:2px solid var(--border); cursor:pointer; font-size:0.92rem; font-weight:500; line-height:1.35; text-align:left; color:var(--ink); background:var(--card); transition:all 0.12s; box-shadow:2px 2px 0 var(--border); }
.opt:hover:not(:disabled) { transform:translateY(-2px); border-color:var(--accent); }
.opt-label { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:900; font-size:0.82rem; flex-shrink:0; background:var(--border); color:var(--muted); transition:all 0.12s; }
.opt:hover:not(:disabled) .opt-label { background:var(--accent); color:#fff; }
.opt.correct { background:#e8f7ee; border-color:var(--green); }
.opt.correct .opt-label { background:var(--green); color:#fff; }
.opt.wrong { background:#fdecea; border-color:var(--red); opacity:0.7; }
.opt.wrong .opt-label { background:var(--red); color:#fff; }
.opt.reveal { background:#e8f7ee; border-color:var(--green); }
.opt.reveal .opt-label { background:var(--green); color:#fff; }
.opt:disabled { cursor:default; }
.feedback { margin-top:14px; display:flex; align-items:flex-start; gap:10px; font-size:0.9rem; font-weight:500; opacity:0; transition:opacity 0.3s; padding:12px 16px; border-radius:12px; color:var(--ink); min-height:48px; }
.feedback.show { opacity:1; }
.feedback.ok { background:#e8f7ee; border:1.5px solid #a0d4b8; }
.feedback.fail { background:#fdecea; border:1.5px solid #f0b0a8; }
.feedback .icon { font-size:1rem; flex-shrink:0; margin-top:1px; }
.btn-next { margin-top:16px; background:var(--ink); color:#fff; border:none; border-radius:12px; padding:13px 36px; font-family:'Fraunces',serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.12s; display:none; box-shadow:2px 2px 0 #6b5a3a; }
.btn-next.show { display:inline-flex; }
.btn-next:hover { transform:translateY(-1px); }

#indiv { max-width:400px; width:100%; text-align:center; }
.ind-team { display:inline-block; background:var(--accent); color:#fff; font-family:'Fraunces',serif; font-size:0.85rem; font-weight:700; padding:5px 16px; border-radius:99px; margin-bottom:16px; }
.ind-score { font-family:'Fraunces',serif; font-size:clamp(4rem,14vw,7rem); font-weight:900; color:var(--ink); line-height:1; margin:0 0 4px; }
.ind-of { font-size:1rem; color:var(--muted); margin-bottom:8px; }
.ind-label { font-family:'Fraunces',serif; font-size:1.2rem; font-weight:700; color:var(--ink); margin-bottom:24px; }
.ind-bars { width:100%; margin-bottom:20px; }
.rbar { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:0.83rem; }
.rbar-q { width:20px; color:var(--muted); text-align:right; font-weight:700; font-family:'Fraunces',serif; }
.rbar-track { flex:1; height:9px; background:var(--border); border-radius:99px; overflow:hidden; }
.rbar-fill { height:100%; border-radius:99px; width:0; transition:width 0.8s ease; }
.rbar-fill.ok { background:var(--green); }
.rbar-fill.fail { background:var(--red); }
.rbar-icon { font-size:0.95rem; }
.ind-status { background:#fff5f0; border:2px solid #f0d0c0; border-radius:12px; padding:11px 16px; font-size:0.85rem; font-weight:600; color:var(--accent); margin-bottom:16px; }
.btn-go-podio { background:var(--ink); color:#fff; border:none; border-radius:12px; padding:14px 40px; font-family:'Fraunces',serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.12s; box-shadow:2px 2px 0 #6b5a3a; }
.btn-go-podio:hover { transform:translateY(-1px); }

#podio { max-width:540px; width:100%; text-align:center; }
#podio h2 { font-family:'Fraunces',serif; font-size:clamp(2rem,6vw,3.2rem); font-weight:900; color:var(--ink); margin-bottom:4px; }
.pod-sub { color:var(--muted); font-size:0.9rem; margin-bottom:28px; }
.podio-stage { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:24px; }
.pod-col { display:flex; flex-direction:column; align-items:center; gap:5px; }
.pod-medal { font-size:1.6rem; }
.pod-name { font-family:'Fraunces',serif; font-weight:900; font-size:1rem; color:var(--ink); }
.pod-pts { font-size:0.78rem; font-weight:600; color:var(--muted); }
.pod-block { border-radius:10px 10px 0 0; width:110px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:900; font-size:1.4rem; color:#fff; }
.pod-block.first { background:var(--gold); height:110px; }
.pod-block.second { background:#94a3b8; height:78px; }
.pod-block.third { background:#cd7f32; height:54px; }
.pod-empty { width:110px; height:54px; border:2.5px dashed var(--border); border-radius:10px 10px 0 0; display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:var(--muted); font-weight:600; }
.ranking-list { width:100%; margin-bottom:20px; }
.rank-row { display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--card); border-radius:12px; margin-bottom:8px; border:2px solid var(--border); box-shadow:2px 2px 0 var(--border); }
.rank-pos { font-family:'Fraunces',serif; font-weight:900; font-size:1.1rem; color:var(--accent); width:24px; text-align:center; }
.rank-name { flex:1; font-family:'Fraunces',serif; font-weight:700; font-size:1rem; text-align:left; }
.rank-bar-wrap { width:60px; height:7px; background:var(--border); border-radius:99px; overflow:hidden; }
.rank-bar { height:100%; background:var(--accent); border-radius:99px; width:0; transition:width 1s ease; }
.rank-score { font-family:'Fraunces',serif; font-weight:900; font-size:1rem; color:var(--ink); min-width:36px; text-align:right; }
.rank-pending { color:var(--muted); font-size:0.75rem; font-weight:500; }
.pod-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.btn-ref { background:var(--card); color:var(--ink); border:2px solid var(--border); border-radius:10px; padding:11px 20px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.15s; box-shadow:2px 2px 0 var(--border); }
.btn-ref:hover { border-color:var(--ink); transform:translateY(-1px); }
.btn-home { background:var(--ink); color:#fff; border:none; border-radius:10px; padding:11px 20px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.15s; box-shadow:2px 2px 0 #6b5a3a; }
.btn-home:hover { transform:translateY(-1px); }
.btn-del { background:var(--card); color:var(--red); border:2px solid #f0b0a8; border-radius:10px; padding:11px 20px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.15s; }
.btn-del:hover { background:#fdecea; }
.loading-txt { color:var(--muted); font-size:0.92rem; padding:16px 0; }
@media(max-width:500px){ .options{grid-template-columns:1fr;} .pod-block,.pod-empty{width:86px;} }
</style>
</head>
<body>

<div class="screen" id="intro">
  <span class="intro-badge">Nu · XSell & Experiments</span>
  <h1>¿Quién<br>sabe <em>más?</em></h1>
  <p class="sub">5 preguntas · 20 segundos cada una</p>
  <div class="team-box">
    <h3>Selecciona tu equipo</h3>
    <div class="team-grid" id="teamGrid"></div>
    <button class="btn-start" id="btnStart" onclick="iniciarJuego()" disabled>Empezar →</button>
    <button class="btn-podio" onclick="verPodio()">🏆 Ver podio</button>
  </div>
</div>

<div class="screen hidden" id="quiz">
  <div class="q-topbar">
    <span class="q-team-tag" id="qTeamTag"></span>
    <span class="q-counter" id="qNum">Pregunta 1 / 5</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="timer-row">
    <span class="timer-label">Tiempo</span>
    <div class="timer-ring">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="17"/>
        <circle cx="22" cy="22" r="17" class="arc" id="arc" stroke-dasharray="106.8" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="timerNum">20</div>
    </div>
  </div>
  <div class="question-text" id="qText"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback">
    <span class="icon" id="fbIcon"></span>
    <span class="msg" id="fbMsg"></span>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextQuestion()">Siguiente →</button>
</div>

<div class="screen hidden" id="indiv">
  <span class="ind-team" id="indTeam"></span>
  <div class="ind-score" id="indScore"></div>
  <div class="ind-of">de 5 puntos</div>
  <div class="ind-label" id="indLabel"></div>
  <div class="ind-bars" id="indBars"></div>
  <div class="ind-status" id="indStatus">Guardando resultado...</div>
  <button class="btn-go-podio" onclick="verPodio()">Ver el podio →</button>
</div>

<div class="screen hidden" id="podio">
  <h2>🏆 Podio</h2>
  <p class="pod-sub" id="podSub"></p>
  <div id="podioContent"><p class="loading-txt">Cargando...</p></div>
  <div class="pod-actions" style="margin-top:16px;">
    <button class="btn-ref" onclick="verPodio()">↻ Actualizar</button>
    <button class="btn-home" onclick="volverInicio()">← Inicio</button>
    <button class="btn-del" onclick="resetTodo()">🗑 Borrar todo</button>
  </div>
</div>

<script>
const GIST_ID = "ee331ff49db08de1057d2f6cf65b79e0";
const GH_TOKEN = "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";
const GIST_FILE = "nu-quiz-scores.json";
const GIST_API = `https://api.github.com/gists/${GIST_ID}`;

const TEAMS = ["Equipo 1","Equipo 2","Equipo 3","Equipo 4"];
const circ = 2 * Math.PI * 17;
const Q = [
  { q:"Bancolombia crash: ¿cuál fue el lift en released → first deposit (7 días) para el copy transaccional?",
    opts:{a:"+2.5%",b:"−11.8%",c:"+17.8%",d:"+10%"}, answer:"c", explain:"Copy transaccional: +17.8%. Security copy: solo +2.5%." },
  { q:"XSell funnel (sem. 18 mayo): ¿cuál fue el Offered → Started de Cuenta XSell?",
    opts:{a:"12.5%",b:"4.56%",c:"1.2%",d:"18.9%"}, answer:"b", explain:"Credit 2.55% · Credit Fee 3.33% · Cuenta 4.56%." },
  { q:"¿Qué % de los clicks de XSell pasan por el Product Widget?",
    opts:{a:"30–35%",b:"Más del 90%",c:"~50%",d:"71–74%"}, answer:"d", explain:"71–74% del tráfico XSell pasa por el Product Widget." },
  { q:"Cuenta Mkt Screen: ¿quiénes tuvieron mayor release rate?",
    opts:{a:"Full-readers (21–30s)",b:"Sub-readers (0–20s)",c:"Ambos ~50%",d:"Over-readers (31s+)"}, answer:"b", explain:"Sub-readers: 58–60%. Full-readers: 46.3%." },
  { q:"En menos de un año, ¿qué método desplazó a PSE como primer depósito?",
    opts:{a:"ACH",b:"Débito automático",c:"Bre-B",d:"Transferencia bancaria"}, answer:"c", explain:"PSE: 82.5% → 44.1%. Bre-B: 5% → 51.3%." }
];

let selectedTeam = null, cur = 0, score = 0, results = [], timer, timeLeft;

// ── GIST API ──
async function gistGet() {
  try {
    const r = await fetch(GIST_API, {
      headers: { "Authorization": `token ${GH_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
    });
    const data = await r.json();
    const content = data.files[GIST_FILE].content;
    return JSON.parse(content);
  } catch(e) { return { scores: {} }; }
}

async function gistSet(obj) {
  try {
    await fetch(GIST_API, {
      method: "PATCH",
      headers: {
        "Authorization": `token ${GH_TOKEN}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(obj) } } })
    });
    return true;
  } catch(e) { return false; }
}

// ── TEAM BUTTONS ──
async function renderTeamBtns() {
  const data = await gistGet();
  const scores = data.scores || {};
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';
  TEAMS.forEach(t => {
    const done = scores[t] !== undefined;
    const btn = document.createElement('button');
    btn.className = 'team-btn' + (done ? ' done' : '') + (selectedTeam === t ? ' selected' : '');
    btn.innerHTML = `<span class="t-label">Equipo</span>${t.replace('Equipo ','')}`;
    if (!done) btn.onclick = () => selectTeam(t);
    grid.appendChild(btn);
  });
}

function selectTeam(t) {
  selectedTeam = t;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('btnStart').disabled = false;
}

window.onload = () => { renderTeamBtns(); show('intro'); };

function iniciarJuego() {
  if (!selectedTeam) return;
  cur = 0; score = 0; results = [];
  document.getElementById('qTeamTag').textContent = selectedTeam;
  show('quiz'); load();
}

// ── QUIZ ──
function load() {
  const q = Q[cur];
  document.getElementById('qNum').textContent = `Pregunta ${cur+1} / ${Q.length}`;
  document.getElementById('progress').style.width = `${(cur/Q.length)*100}%`;
  document.getElementById('qText').textContent = q.q;
  const d = document.getElementById('options'); d.innerHTML = '';
  ['a','b','c','d'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.key = k;
    b.innerHTML = `<span class="opt-label">${k.toUpperCase()}</span>${q.opts[k]}`;
    b.onclick = () => pick(k); d.appendChild(b);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnNext').className = 'btn-next';
  tick();
}

function tick() {
  timeLeft = 20; arcSet(20);
  document.getElementById('timerNum').textContent = 20;
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerNum').textContent = timeLeft;
    arcSet(timeLeft);
    document.querySelector('.arc').style.stroke = timeLeft <= 5 ? 'var(--red)' : 'var(--accent)';
    if (timeLeft <= 0) { clearInterval(timer); tout(); }
  }, 1000);
}

function arcSet(t) { document.getElementById('arc').style.strokeDashoffset = circ - (t/20)*circ; }
function tout() { lock(); rev(); fb(false, "⏱ Tiempo agotado. " + Q[cur].explain); results.push(false); nxt(); }

function pick(k) {
  clearInterval(timer);
  const ok = k === Q[cur].answer; if (ok) score++;
  results.push(ok); lock();
  document.querySelectorAll('.opt').forEach(b => {
    if (b.dataset.key === k && !ok) b.classList.add('wrong');
    if (b.dataset.key === Q[cur].answer) b.classList.add('correct');
  });
  fb(ok, (ok ? '¡Correcto! ' : 'Incorrecto. ') + Q[cur].explain); nxt();
}

function lock() { document.querySelectorAll('.opt').forEach(b => b.setAttribute('disabled', true)); }
function rev() { document.querySelectorAll('.opt').forEach(b => { if (b.dataset.key === Q[cur].answer) b.classList.add('reveal'); }); }
function fb(ok, msg) {
  const f = document.getElementById('feedback');
  document.getElementById('fbIcon').textContent = ok ? '✅' : '❌';
  document.getElementById('fbMsg').textContent = msg;
  f.className = 'feedback show ' + (ok ? 'ok' : 'fail');
}
function nxt() {
  const b = document.getElementById('btnNext'); b.className = 'btn-next show';
  b.textContent = cur < Q.length-1 ? 'Siguiente →' : 'Ver resultado →';
}
function nextQuestion() { cur++; cur >= Q.length ? finalizarEquipo() : load(); }

// ── RESULTADO ──
async function finalizarEquipo() {
  document.getElementById('indTeam').textContent = selectedTeam;
  document.getElementById('indScore').textContent = score;
  const msgs = ['😬 Hay que estudiar más','📊 Pueden mejorar','🔥 Sólido','💜 Muy bien','🏆 Perfectos'];
  document.getElementById('indLabel').textContent = msgs[score] || msgs[0];
  const bars = document.getElementById('indBars'); bars.innerHTML = '';
  results.forEach((ok, i) => {
    bars.innerHTML += `<div class="rbar"><span class="rbar-q">${i+1}</span><div class="rbar-track"><div class="rbar-fill ${ok?'ok':'fail'}" id="ib${i}"></div></div><span class="rbar-icon">${ok?'✅':'❌'}</span></div>`;
  });
  show('indiv');
  setTimeout(() => results.forEach((ok, i) => { document.getElementById('ib'+i).style.width = ok ? '100%' : '25%'; }), 100);

  document.getElementById('indStatus').textContent = '💾 Guardando resultado...';
  const data = await gistGet();
  data.scores = data.scores || {};
  data.scores[selectedTeam] = { score, results, ts: Date.now() };
  const ok = await gistSet(data);
  const done = Object.keys(data.scores).length;
  document.getElementById('indStatus').textContent = ok
    ? (done < 4 ? `✅ Guardado · Faltan ${4-done} equipo${4-done>1?'s':''} por jugar` : '✅ ¡Todos jugaron! Ve el podio →')
    : '✅ Resultado guardado';
}

// ── PODIO ──
async function verPodio() {
  show('podio');
  document.getElementById('podSub').textContent = '';
  document.getElementById('podioContent').innerHTML = '<p class="loading-txt">Cargando resultados...</p>';
  const data = await gistGet();
  renderPodio(data.scores || {});
}

function renderPodio(scores) {
  const withScore = TEAMS.filter(t => scores[t]).map(t => ({ name: t, score: scores[t].score }));
  const pending   = TEAMS.filter(t => !scores[t]);
  withScore.sort((a, b) => b.score - a.score);
  const all = [...withScore, ...pending.map(t => ({ name: t, score: null }))];
  const maxScore = withScore.length ? Math.max(withScore[0].score, 1) : 1;
  const done = withScore.length;

  document.getElementById('podSub').textContent = `${done} de 4 equipos han jugado`;

  // Podio visual
  const top = withScore.slice(0, 3);
  const visual = [top[1]||null, top[0]||null, top[2]||null];
  const vCls = ['second','first','third'], vMed = ['🥈','🥇','🥉'], vNum = ['2°','1°','3°'];
  let html = '<div class="podio-stage">';
  visual.forEach((p, i) => {
    if (p) html += `<div class="pod-col"><div class="pod-medal">${vMed[i]}</div><div class="pod-name">${p.name}</div><div class="pod-pts">${p.score}/5</div><div class="pod-block ${vCls[i]}">${vNum[i]}</div></div>`;
    else    html += `<div class="pod-col"><div class="pod-empty">—</div></div>`;
  });
  html += '</div><div class="ranking-list">';
  all.forEach((p, i) => {
    const pend = p.score === null;
    html += `<div class="rank-row"><span class="rank-pos">${pend?'—':i+1}</span><span class="rank-name">${p.name}</span><div class="rank-bar-wrap"><div class="rank-bar" id="rb${i}"></div></div><span class="rank-score">${pend?'<span class="rank-pending">pendiente</span>':p.score+'/5'}</span></div>`;
  });
  html += '</div>';
  document.getElementById('podioContent').innerHTML = html;
  setTimeout(() => all.forEach((p,i) => { const el=document.getElementById('rb'+i); if(el&&p.score!==null) el.style.width=`${(p.score/maxScore)*100}%`; }), 150);
}

async function resetTodo() {
  if (!confirm('¿Borrar todos los resultados del podio?')) return;
  await gistSet({ scores: {} });
  selectedTeam = null;
  document.getElementById('btnStart').disabled = true;
  await renderTeamBtns();
  show('intro');
}

function volverInicio() {
  selectedTeam = null;
  document.getElementById('btnStart').disabled = true;
  renderTeamBtns();
  show('intro');
}

function show(id) {
  ['intro','quiz','indiv','podio'].forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}
</script>
